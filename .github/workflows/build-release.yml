name: Build and Release EXE

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Determine next version
        id: ver
        run: |
          git fetch --tags
          latest=$(git tag -l "v*" --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            echo "v1.0" > next.txt
            echo "next=v1.0" >> $GITHUB_OUTPUT
          else
            # remove leading v
            ver=${latest#v}
            IFS='.' read -r major minor <<< "$ver"
            minor=$((minor + 1))
            next="v${major}.${minor}"
            echo "${next}" > next.txt
            echo "next=${next}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create and push tag
        if: steps.ver.outputs.next != ''
        run: |
          TAG=${{ steps.ver.outputs.next }}
          echo "Creating tag $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # set authenticated remote so push works with GITHUB_TOKEN
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        shell: bash

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --name filelister.exe run.py

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.ver.outputs.next }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/filelister.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create CI issue on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = process.env.GITHUB_SHA;
            const workflow = process.env.GITHUB_WORKFLOW;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            // check for existing open issue that mentions this commit
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.data.find(i => i.body && i.body.includes(sha));
            if (existing) {
              console.log(`Found existing issue #${existing.number} for commit ${sha}`);
              return existing.number;
            }
            const title = `CI failure: ${workflow} ${sha.substring(0,7)}`;
            const body = `Automated issue created because workflow run failed.\n\nWorkflow: ${workflow}\nRun: ${runUrl}\nCommit: ${sha}\nBranch: ${process.env.GITHUB_REF}\n\nWhen you push a fix, include the issue number (for example, #123) in your commit message to have the issue auto-closed when the build succeeds.`;
            const issue = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['ci-failure']});
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.data.number, body: `Issue created for failed workflow run ${runUrl}. To auto-close this issue when the build passes, include #${issue.data.number} in your next commit message.`});
            return issue.data.number;

      - name: Close referenced issue on success
        if: success()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = process.env.GITHUB_SHA;
            const { data: commit } = await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: sha });
            const message = commit.commit.message;
            const m = message.match(/#(\d+)/);
            if (m) {
              const num = parseInt(m[1], 10);
              try {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: num, state: 'closed' });
                console.log(`Closed issue #${num} referenced in commit message.`);
                return `closed ${num}`;
              } catch (err) {
                console.log(`Could not close issue #${num}: ${err}`);
                return 'error';
              }
            }
            console.log('No issue reference found in commit message.');
            return 'none';
